name: Apply Traditional Chinese localization

on:
  push:
    branches:
      - agent/traditional-chinese

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCC
        run: python3 -m pip install --disable-pip-version-check opencc-python-reimplemented

      - name: Add zh-TW support and translations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from opencc import OpenCC

          branch_files = [
              Path("3ds/source/SettingsScreen.cpp"),
              Path("switch/source/SettingsScreen.cpp"),
          ]

          old_languages = '{"en", "it", "es", "fr", "de", "pt", "nl", "ja", "zh", "ru"}'
          new_languages = '{"en", "it", "es", "fr", "de", "pt", "nl", "ja", "zh", "zh-TW", "ru"}'
          old_name = '        if (code == "zh")\n            return "简体中文";'
          new_name = old_name + '\n        if (code == "zh-TW")\n            return "繁體中文";'

          for path in branch_files:
              text = path.read_text(encoding="utf-8")
              if new_languages not in text:
                  if old_languages not in text:
                      raise SystemExit(f"Language list marker not found in {path}")
                  text = text.replace(old_languages, new_languages, 1)
              if 'if (code == "zh-TW")' not in text:
                  if old_name not in text:
                      raise SystemExit(f"Language name marker not found in {path}")
                  text = text.replace(old_name, new_name, 1)
              path.write_text(text, encoding="utf-8")

          # Keep the public header documentation in sync with the implementation.
          hpp = Path("common/i18n.hpp")
          hpp_text = hpp.read_text(encoding="utf-8")
          hpp_text = hpp_text.replace("'zh', 'ru'", "'zh', 'zh-TW', 'ru'")
          hpp_text = hpp_text.replace('"zh", "ru"', '"zh", "zh-TW", "ru"')
          hpp.write_text(hpp_text, encoding="utf-8")

          cc = OpenCC("s2twp")
          phrase_overrides = (
              ("文件夾", "資料夾"),
              ("網絡", "網路"),
              ("服務器", "伺服器"),
              ("默認", "預設"),
              ("軟件", "軟體"),
              ("用戶", "使用者"),
              ("信息", "資訊"),
              ("數據", "資料"),
              ("遊戲卡帶", "遊戲卡匣"),
              ("卡帶", "卡匣"),
              ("恢復", "還原"),
              ("設置", "設定"),
              ("保存", "儲存"),
              ("擴展資料", "擴充資料"),
          )

          def to_tw(s: str) -> str:
              out = cc.convert(s)
              for src, dst in phrase_overrides:
                  out = out.replace(src, dst)
              return out

          def add_zh_tw(path: Path) -> int:
              src_lines = path.read_text(encoding="utf-8").splitlines()
              out = []
              added = 0
              for line in src_lines:
                  stripped = line.strip()
                  if not stripped.startswith('"zh":'):
                      out.append(line)
                      continue

                  indent = line[:len(line) - len(line.lstrip())]
                  rhs = stripped[len('"zh":'):].strip()
                  has_comma = rhs.endswith(',')
                  raw = rhs[:-1].rstrip() if has_comma else rhs
                  value = json.loads(raw)
                  tw = to_tw(value)

                  # The new zh-TW member follows zh. If zh used to be the last
                  # member, add the comma it now needs; otherwise preserve it.
                  if has_comma:
                      out.append(line)
                  else:
                      out.append(line + ',')
                  out.append(f'{indent}"zh-TW": {json.dumps(tw, ensure_ascii=False)}' + (',' if has_comma else ''))
                  added += 1

              path.write_text("\n".join(out) + "\n", encoding="utf-8")
              return added

          counts = {}
          for p in [Path("3ds/assets/romfs/i18n.json"), Path("switch/romfs/i18n.json")]:
              counts[str(p)] = add_zh_tw(p)
              # Parse the finished file to guarantee valid JSON.
              data = json.loads(p.read_text(encoding="utf-8"))
              if not any(isinstance(v, dict) and "zh-TW" in v for v in data.values()):
                  raise SystemExit(f"No zh-TW entries produced in {p}")

          # Core support was added in the preceding commit; fail loudly if it
          # ever disappears so the localization cannot silently fall back to English.
          core = Path("common/i18n.cpp").read_text(encoding="utf-8")
          if 'code == "zh-TW"' not in core:
              raise SystemExit("common/i18n.cpp does not accept zh-TW")

          print("Traditional Chinese entries added:", counts)
          PY

      - name: Validate localization
        run: |
          python3 -m json.tool 3ds/assets/romfs/i18n.json >/dev/null
          python3 -m json.tool switch/romfs/i18n.json >/dev/null
          grep -q '"zh-TW"' common/i18n.cpp
          grep -q '"zh-TW"' 3ds/source/SettingsScreen.cpp
          grep -q '"zh-TW"' switch/source/SettingsScreen.cpp
          grep -q '"zh-TW"' 3ds/assets/romfs/i18n.json
          grep -q '"zh-TW"' switch/romfs/i18n.json

      - name: Commit generated localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/i18n.hpp 3ds/source/SettingsScreen.cpp switch/source/SettingsScreen.cpp 3ds/assets/romfs/i18n.json switch/romfs/i18n.json
          git rm .github/workflows/apply-zh-tw.yml
          git commit -m "Add Traditional Chinese localization"
          git push
