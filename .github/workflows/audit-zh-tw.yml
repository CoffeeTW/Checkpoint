name: Audit Traditional Chinese localization

on:
  push:
    branches:
      - agent/traditional-chinese

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit every zh-TW string
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path('3ds/assets/romfs/i18n.json'),
              Path('switch/romfs/i18n.json'),
          ]
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              missing = []
              print(f'=== {path} ===')
              print(f'keys={len(data)}')
              for key, langs in data.items():
                  if not isinstance(langs, dict) or 'en' not in langs:
                      continue
                  tw = langs.get('zh-TW')
                  if tw is None:
                      missing.append((key, langs['en']))
                      tw = '<MISSING>'
                  en = langs['en'].replace('\n', '\\n')
                  tw = tw.replace('\n', '\\n')
                  print(f'{key}\tEN={en}\tTW={tw}')
              print(f'--- missing={len(missing)} ---')
              for key, en in missing:
                  print(f'MISSING\t{key}\t{en.replace(chr(10), "\\n")}')
          PY
