          def apply(path, overrides):
              data = json.loads(path.read_text(encoding='utf-8'))
              merged = dict(common)
              merged.update(overrides)
              unknown = [k for k in merged if k not in data]
              # Common dictionary intentionally spans both platforms; only apply keys that exist.
              for key, value in merged.items():
                  if key in data and isinstance(data[key], dict) and 'en' in data[key]:
                      data[key]['zh-TW'] = value
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              return data

          files = [
              (Path('3ds/assets/romfs/i18n.json'), tw3ds),
              (Path('switch/romfs/i18n.json'), twswitch),
          ]
          placeholder = re.compile(r'\{\d+\}')
          banned = ['擴充套件', '校驗', '已禁用', '無響應', '新建備份', '當前存檔', '選中的', '軟體包解壓', 'TF卡']

          for path, overrides in files:
              data = apply(path, overrides)
              missing = []
              bad_params = []
              bad_words = []
              for key, langs in data.items():
                  if not isinstance(langs, dict) or 'en' not in langs:
                      continue
                  if 'zh-TW' not in langs:
                      missing.append(key)
                      continue
                  en_params = sorted(placeholder.findall(langs['en']))
                  tw_params = sorted(placeholder.findall(langs['zh-TW']))
                  if en_params != tw_params:
                      bad_params.append((key, en_params, tw_params))
                  for word in banned:
                      if word in langs['zh-TW']:
                          bad_words.append((key, word, langs['zh-TW']))
              if missing or bad_params or bad_words:
                  raise SystemExit(f'{path}: missing={missing}, placeholders={bad_params}, banned={bad_words}')
              print(f'{path}: {len(data)} keys validated; all EN entries have zh-TW')
          PY

      - name: Validate JSON
        run: |
          python3 -m json.tool 3ds/assets/romfs/i18n.json >/dev/null
          python3 -m json.tool switch/romfs/i18n.json >/dev/null

      - name: Commit proofread localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3ds/assets/romfs/i18n.json switch/romfs/i18n.json
          git rm .github/workflows/audit-zh-tw.yml .github/workflows/proofread-zh-tw.yml
          git commit -m "Polish Traditional Chinese localization"
          git push
